<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ADHD Budget Planner — Calm Money Command Center</title>
<style>
:root{--bg:#f4f5f1;--panel:#ffffff;--panel2:#eef1eb;--ink:#18352e;--muted:#78847e;--line:#dfe5dc;--accent:#2e6b58;--accent2:#b6cdb5;--gold:#c9a66b;--danger:#bd625f;--warn:#c98a3d;--shadow:0 12px 35px #17352e0d;--radius:22px}
[data-theme="dark"]{--bg:#0c1122;--panel:#151c35;--panel2:#1e2846;--ink:#eef0ff;--muted:#9aa3c9;--line:#2a3560;--accent:#5ee6c4;--accent2:#3a4fa3;--gold:#ffd27a;--danger:#ff8fa3;--warn:#ffb86b;--shadow:0 14px 40px #00000070;color-scheme:dark}
[data-theme="dark"] body{background:radial-gradient(1200px 600px at 10% -10%,#3b2a7a55,transparent 70%),var(--bg)}
[data-theme="dark"] .logo,[data-theme="dark"] .btn.primary,[data-theme="dark"] .nav .badge{color:#0b1020}
[data-theme="dark"] .pill.ok{color:#0b1020}
[data-theme="dark"] .hero-ask{background:linear-gradient(135deg,#6d5cf6,#2f9fd8)}
[data-theme="dark"] .hero-ask .eyebrow{color:#e4e0ff}
[data-theme="dark"] .card{background:linear-gradient(180deg,var(--panel),color-mix(in srgb,var(--panel) 85%,#000))}
[data-theme="galapagos"]{--bg:#2E3033;--panel:#25272A;--panel2:#3D3F43;--ink:#F3F1EC;--muted:#B9BCB4;--line:#61635E;--accent:#1EA3A1;--accent2:#61635E;--gold:#CC5433;--danger:#CC5433;--warn:#CC5433;--shadow:0 14px 40px #00000066;color-scheme:dark}
[data-theme="galapagos"] .logo,[data-theme="galapagos"] .btn.primary,[data-theme="galapagos"] .nav .badge,[data-theme="galapagos"] .pill.ok{color:#11201f}
[data-theme="galapagos"] .hero-ask{background:linear-gradient(135deg,#1EA3A1,#61635E)}
[data-theme="galapagos"] .pill.warn{background:#4a2419;color:#f3b6a2}
[data-theme="galapagos"] .pill.bad{background:#4a2419;color:#f3b6a2}
[data-theme="riviera"]{--bg:#F3ECDE;--panel:#FBF8F1;--panel2:#E9DCC4;--ink:#183451;--muted:#7A6A55;--line:#D4AF83;--accent:#183451;--accent2:#D4AF83;--gold:#A9501C;--danger:#A9501C;--warn:#A9501C;--shadow:0 12px 32px #18345114}
[data-theme="riviera"] .hero-ask{background:linear-gradient(135deg,#183451,#A9501C)}
[data-theme="riviera"] .hero-ask .eyebrow{color:#F3ECDE}
[data-theme="riviera"] .pill.ok{background:#D4AF83;color:#183451}
[data-theme="riviera"] .pill.warn{background:#F0D9C2;color:#7a3614}
[data-theme="riviera"] .pill.bad{background:#EFD0C0;color:#7a3614}
[data-theme="lavender"]{--bg:#f6f3fa;--panel:#ffffff;--panel2:#eee8f7;--ink:#352744;--muted:#887e91;--line:#e5dff0;--accent:#8062a8;--accent2:#d9c8ec;--gold:#c59b5b;--danger:#b8636b;--warn:#c59b5b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;transition:background .3s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.app{display:flex;min-height:100vh}
.sidebar{width:262px;background:var(--panel);border-right:1px solid var(--line);padding:24px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;z-index:3;overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px;padding:0 10px 24px}
.logo{width:44px;height:44px;border-radius:15px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:900;font-size:17px;letter-spacing:.5px}
.brand b{font:800 21px Georgia,serif;letter-spacing:-.4px;display:block}
.brand small{color:var(--muted);font-size:12px}
.nav{display:grid;gap:4px}
.nav button{color:var(--muted);padding:11px 13px;border-radius:14px;text-align:left;display:flex;align-items:center;gap:12px;transition:.2s}
.nav button:hover,.nav button.active{background:var(--panel2);color:var(--ink)}
.nav button.active{box-shadow:inset 3px 0 0 var(--accent)}
.nav .ico{width:24px;text-align:center;font-size:16px}
.nav .badge{margin-left:auto;background:var(--accent);color:#fff;border-radius:20px;padding:1px 8px;font-size:11px}
.side-bottom{margin-top:auto;background:var(--panel2);border-radius:17px;padding:15px;color:var(--muted);line-height:1.55;font-size:12.5px}
.main{flex:1;min-width:0;padding:28px 34px 60px}
.topbar{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:24px;flex-wrap:wrap}
.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase}
.title{font:800 clamp(28px,3vw,42px)/1.05 Georgia,serif;margin:8px 0 6px;letter-spacing:-.5px}
.subtitle{color:var(--muted)}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{padding:10px 15px;border-radius:13px;background:var(--panel);border:1px solid var(--line);color:var(--ink);transition:.2s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:10px}
.grid{display:grid;gap:18px}
.metrics{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}
.dash{grid-template-columns:1.4fr 1fr 1fr}
.two{grid-template-columns:1fr 1fr}
.span2{grid-column:span 2}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card h3{margin:0;font-size:16px}
.card h4{margin:0 0 8px}
.metric-label{color:var(--muted);font-size:12px}
.metric-value{font-size:30px;font-weight:850;margin:8px 0 4px;letter-spacing:-1px}
.trend{font-size:12px;color:var(--accent)}
.trend.bad{color:var(--danger)}
.muted{color:var(--muted)}
.small{font-size:12px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:30px;background:var(--panel2);font-size:11px;color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--accent2);color:var(--ink)}
.pill.warn{background:#f6e7cf;color:#7a5418}
.pill.bad{background:#f4dedc;color:#7d2f2b}
[data-theme="dark"] .pill.warn{background:#3a2d17;color:#e9c98f}
[data-theme="dark"] .pill.bad{background:#3d2220;color:#f0b0ac}
.progress{height:9px;background:var(--panel2);border-radius:20px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);border-radius:20px;transition:width .5s}
.progress>i.warn{background:var(--warn)}
.progress>i.bad{background:var(--danger)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack{display:grid;gap:12px}
.list-item{padding:12px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.check{width:19px;height:19px;accent-color:var(--accent);cursor:pointer}
.field{width:100%;padding:11px 13px;background:var(--panel2);border:1px solid transparent;border-radius:12px;color:var(--ink);outline:none;transition:.2s}
.field:focus{border-color:var(--accent);background:var(--panel)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid .full{grid-column:1/-1}
label.lbl{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.section{display:none}
.section.active{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.toolbar h2{font:800 30px Georgia,serif;margin:0;letter-spacing:-.4px}
.modal{position:fixed;inset:0;background:#0b17118f;backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal.show{display:flex}
.modal-box{background:var(--panel);width:min(580px,100%);max-height:90vh;overflow:auto;border-radius:25px;padding:26px;border:1px solid var(--line);box-shadow:var(--shadow);position:relative}
.modal-box h2{font:800 26px Georgia,serif;margin:0 0 16px}
.close{position:absolute;right:16px;top:16px;background:var(--panel2);border-radius:50%;width:32px;height:32px}
.ring{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;position:relative;flex-shrink:0}
.ring:after{content:"";position:absolute;inset:11px;background:var(--panel);border-radius:50%}
.ring b{position:relative;z-index:1;font-size:24px}
.donut{width:150px;height:150px;border-radius:50%;position:relative;flex-shrink:0}
.donut:after{content:"";position:absolute;inset:26px;background:var(--panel);border-radius:50%}
.legend{display:grid;gap:8px;flex:1;min-width:150px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:7px}
.bars{display:flex;align-items:flex-end;gap:12px;height:190px;padding-top:12px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end}
.bar{width:100%;max-width:38px;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:9px 9px 3px 3px;min-height:4px;transition:height .6s}
.bar-col small{color:var(--muted);font-size:11px}
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.theme-opt{display:grid;gap:7px;text-align:left;padding:10px;border:1px solid var(--line);border-radius:16px;background:var(--panel2);transition:.2s}
.theme-opt:hover{border-color:var(--accent)}
.theme-opt.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.theme-opt .swatch{display:grid;grid-template-columns:1fr 1fr;gap:4px;height:62px}
.theme-opt .swatch i{display:block;border-radius:9px}
.theme-opt b{font-size:13px}
.theme-opt small{color:var(--muted);font-size:11px;line-height:1.3}
.table{width:100%;border-collapse:collapse}
.table th,.table td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line);font-size:13px}
.table th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:1px}
.table .num{text-align:right;font-variant-numeric:tabular-nums}
.empty{padding:34px;text-align:center;color:var(--muted)}
.hero-ask{background:linear-gradient(135deg,var(--accent),#3f8a72);color:#fff;border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
.hero-ask .eyebrow{color:#dff3e8}
.hero-ask h2{font:800 26px Georgia,serif;margin:8px 0 6px}
.hero-ask p{margin:0;opacity:.9}
.hero-ask .btn{background:#ffffffee;color:var(--ink);border-color:transparent}
.timeline{position:relative;padding-left:18px}
.timeline:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl{position:relative;padding:8px 0}
.tl:before{content:"";position:absolute;left:-18px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.tl.late:before{background:var(--danger)}
.tl.paid:before{background:var(--muted);opacity:.5}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.heat i{aspect-ratio:1;border-radius:6px;background:var(--panel2)}
.toast{position:fixed;right:25px;bottom:25px;background:var(--ink);color:var(--bg);padding:13px 18px;border-radius:13px;display:none;z-index:20;box-shadow:var(--shadow)}
.toast.show{display:block;animation:fade .3s}
.mobile-menu{display:none}
.timer-big{font:800 64px Georgia,serif;letter-spacing:-2px;margin:10px 0}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
.kv:last-child{border-bottom:0}
@media(max-width:1180px){.sidebar{width:228px}.main{padding:24px}.metrics{grid-template-columns:repeat(2,1fr)}.dash{grid-template-columns:1fr 1fr}.dash .span2{grid-column:span 2}}
@media(max-width:780px){
  .sidebar{position:fixed;left:-280px;transition:.25s;box-shadow:var(--shadow)}
  .sidebar.open{left:0}
  .main{padding:18px}
  .mobile-menu{display:inline-block;margin-bottom:6px}
  .metrics,.dash,.two{grid-template-columns:1fr}
  .dash .span2{grid-column:auto}
  .form-grid{grid-template-columns:1fr}
  .title{font-size:30px}
  .toolbar h2{font-size:26px}
}
@media print{.sidebar,.topbar .actions,.btn,.toolbar .actions,.close{display:none!important}.main{padding:0}.card{box-shadow:none;break-inside:avoid}body{background:#fff;color:#000}}
</style>
</head>
<body data-theme="light">
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="logo">BP</div><div><b>Budget Planner</b><small>Calm money, clear mind</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-bottom">✦ <b>One step at a time.</b><br/>Your job today is just the next action on the dashboard.</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div>
        <button class="btn mobile-menu" onclick="$('#sidebar').classList.toggle('open')">☰</button>
        <div class="eyebrow" id="eyebrow">YOUR MONEY COMMAND CENTER</div>
        <div class="title" id="pageTitle">Good morning.</div>
        <div class="subtitle" id="pageSub"></div>
      </div>
      <div class="actions">
        <button class="btn" onclick="openQuick()">＋ Quick add</button>
        <button class="btn" onclick="cycleTheme()">◐ Theme</button>
      </div>
    </div>
    <section class="section active" id="dashboard"></section>
    <section class="section" id="budget"></section>
    <section class="section" id="transactions"></section>
    <section class="section" id="bills"></section>
    <section class="section" id="debt"></section>
    <section class="section" id="impulse"></section>
    <section class="section" id="subs"></section>
    <section class="section" id="reset"></section>
    <section class="section" id="reports"></section>
    <section class="section" id="settings"></section>
  </main>
</div>
<div class="modal" id="modal"><div class="modal-box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============ helpers ============ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const KEY='adhd_budget_planner_v2';
const now=new Date();
const iso=d=>{const x=new Date(d);return new Date(x.getTime()-x.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const monthOf=d=>iso(d).slice(0,7);
const todayISO=()=>iso(new Date());
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PALETTE=['#2e6b58','#c9a66b','#8062a8','#5d8fb0','#bd625f','#7fa36b','#b08d57','#6f7fa8'];
const ENV_ICON={Housing:'🏠',Food:'🍽️',Transport:'🚗',Fun:'🎉',Health:'🩺',Shopping:'🛍️',Other:'📌'};
const envName=n=>`${ENV_ICON[n]||'🏷️'} ${esc(n)}`;

/* ============ state ============ */
const DEFAULT_ENVELOPES=[
 {id:'e1',name:'Housing',limit:1200,color:PALETTE[0]},
 {id:'e2',name:'Food',limit:450,color:PALETTE[1]},
 {id:'e3',name:'Transport',limit:150,color:PALETTE[3]},
 {id:'e4',name:'Fun',limit:120,color:PALETTE[2]},
 {id:'e5',name:'Health',limit:100,color:PALETTE[5]},
 {id:'e6',name:'Shopping',limit:150,color:PALETTE[4]},
 {id:'e7',name:'Other',limit:100,color:PALETTE[6]}
];
function blank(){return{
 settings:{name:'',currency:'$',theme:'light',payday:1,startedOn:todayISO()},
 envelopes:JSON.parse(JSON.stringify(DEFAULT_ENVELOPES)),
 income:[],expenses:[],
 bills:[],billPaid:{},
 goals:[],debts:[],
 impulse:[],
 subs:[],
 reviews:[],
 brain:[],
 weekly:{done:{}},
 page:'dashboard'
}}
let S=load();
function load(){try{const r=localStorage.getItem(KEY);return r?Object.assign(blank(),JSON.parse(r)):blank()}catch(e){return blank()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const money=n=>{const v=Number(n||0);const s=Math.abs(v).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:2});return (v<0?'−':'')+S.settings.currency+s};
const pct=n=>Math.max(0,Math.min(100,Math.round(n||0)));
const fmtDate=d=>new Date(d+'T00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'});
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(window._t);window._t=setTimeout(()=>el.classList.remove('show'),2200)}
const THEMES=[
 {k:'light',n:'Sage',sub:'bright, airy and pastel',c:['#f4f5f1','#2e6b58','#b6cdb5','#c9a66b']},
 {k:'dark',n:'Midnight',sub:'deep navy and luminous',c:['#0c1122','#151c35','#5ee6c4','#3a4fa3']},
 {k:'lavender',n:'Lavender',sub:'calm and soft',c:['#f6f3fa','#8062a8','#d9c8ec','#c59b5b']},
 {k:'galapagos',n:'Galapagos',sub:'lava black, booby blue, crab orange, iguana grey',c:['#2E3033','#1EA3A1','#CC5433','#61635E']},
 {k:'riviera',n:'Riviera',sub:'riviera blue, terracotta, soft ivory, sand linen',c:['#183451','#A9501C','#F3ECDE','#D4AF83']}];
function themeOpts(){return THEMES.map(t=>`<button type="button" class="theme-opt ${S.settings.theme===t.k?'on':''}" onclick="pickTheme('${t.k}')"><span class="swatch">${t.c.map(x=>`<i style="background:${x}"></i>`).join('')}</span><b>${t.n}</b><small>${t.sub}</small></button>`).join('')}
function pickTheme(k){S.settings.theme=k;save();render();renderSettings();toast('Theme: '+themeLabel())}
function themeLabel(){return {light:'Sage',dark:'Midnight',lavender:'Lavender',galapagos:'Galapagos',riviera:'Riviera'}[S.settings.theme]||'Sage'}

/* ============ navigation ============ */
const NAV=[
 ['dashboard','⌂','Dashboard','Your one-glance money view'],
 ['budget','◎','Budget envelopes','Give every dollar a job'],
 ['transactions','⇄','Transactions','Income and spending log'],
 ['bills','▦','Bills & due dates','Never be surprised again'],
 ['debt','◇','Debt & savings','Snowball and goals'],
 ['impulse','✋','Impulse pause','Wait 48 hours before you buy'],
 ['subs','↻','Subscriptions','Audit what quietly renews'],
 ['reset','✓','Weekly reset','Five calm minutes a week'],
 ['reports','▥','Insights','Patterns you can see'],
 ['settings','⚙','Settings','Make it yours']
];
function renderNav(){
 $('#nav').innerHTML=NAV.map(([id,i,t])=>`<button data-page="${id}" class="${S.page===id?'active':''}" onclick="go('${id}')"><span class="ico">${i}</span>${t}${id==='bills'&&unpaidBillsCount()>0?`<span class="badge">${unpaidBillsCount()}</span>`:''}</button>`).join('');
}
function go(page){S.page=page;save();$$('.section').forEach(x=>x.classList.toggle('active',x.id===page));renderNav();render();$('#sidebar').classList.remove('open');window.scrollTo({top:0,behavior:'smooth'})}

/* ============ derived data ============ */
const curMonth=()=>monthOf(new Date());
const inMonth=(arr,m=curMonth())=>arr.filter(x=>(x.date||'').startsWith(m));
const sum=(arr,f=x=>x.amount)=>arr.reduce((a,x)=>a+Number(f(x)||0),0);
function monthIncome(m=curMonth()){return sum(inMonth(S.income,m))}
function monthSpent(m=curMonth()){return sum(inMonth(S.expenses,m))}
function paidMap(m=curMonth()){return S.billPaid[m]||{}}
function unpaidBills(m=curMonth()){const p=paidMap(m);return S.bills.filter(b=>!p[b.id])}
function unpaidBillsCount(){return unpaidBills().length}
function envSpent(name,m=curMonth()){return sum(inMonth(S.expenses,m).filter(x=>x.env===name))}
function safeToSpend(){
 const m=curMonth();
 return monthIncome(m)-monthSpent(m)-sum(unpaidBills(m));
}
function dayOfMonth(){return new Date().getDate()}
function daysInMonth(){return new Date(now.getFullYear(),now.getMonth()+1,0).getDate()}
function daysUntil(day){const t=new Date();let d=new Date(t.getFullYear(),t.getMonth(),day);if(d<t&&t.getDate()!==day)d=new Date(t.getFullYear(),t.getMonth()+1,day);return Math.round((d-new Date(t.getFullYear(),t.getMonth(),t.getDate()))/86400000)}
function monthsBack(n){const out=[];for(let i=n-1;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);out.push(monthOf(d))}return out}
function envColor(name){const e=S.envelopes.find(x=>x.name===name);return e?e.color:PALETTE[6]}

/* ============ render dispatcher ============ */
function render(){
 document.body.dataset.theme=S.settings.theme;
 renderNav();
 const map={dashboard:renderDashboard,budget:renderBudget,transactions:renderTransactions,bills:renderBills,debt:renderDebt,impulse:renderImpulse,subs:renderSubs,reset:renderReset,reports:renderReports,settings:renderSettings};
 const nav=NAV.find(x=>x[0]===S.page);
 if(S.page==='dashboard'){
   const h=now.getHours();const greet=h<12?'Good morning':h<18?'Good afternoon':'Good evening';

 S.debts.push(demo({name:'Credit card',balance:2400,min:80}),demo({name:'Student loan',balance:6800,min:150}));

  demo({name:'Running shoes',amount:90,date:daysAgo(1),why:'Old pair hurts',decision:'waiting'}));
 S.subs.push(

function removeDemo(){
 if(!hasDemo()){toast('No demo data to remove');return}
 if(!confirm('Remove the demo entries? Your own entries stay.'))return;
 DEMO_KEYS.forEach(k=>{S[k]=S[k].filter(x=>!x.demo)});
 Object.values(S.billPaid).forEach(mo=>Object.keys(mo).forEach(id=>{if(id.startsWith('demo-'))delete mo[id]}));
 save();render();toast('Demo data removed. Your own entries are safe.');
}
function demoBanner(){

function metricCard(label,val,sub,tone,trend){return `<div class="card"><div class="metric-label">${label}</div><div class="metric-value">${val}</div><div class="trend ${tone==='bad'?'bad':''}">${trend}</div><div class="muted small" style="margin-top:6px">${sub}</div></div>`}
function nextActionText(){
 if(!S.settings.name&&!S.income.length&&!S.expenses.length&&!S.bills.length){
  return {title:'Start with your income',body:'Add your most recent paycheck. Everything else builds from there.',btn:'<button class="btn primary" onclick="openIncome()">＋ Add income</button>'};
 }
 const late=S.bills.map(b=>({...b,inDays:daysUntil(b.day)})).filter(b=>!paidMap()[b.id]&&b.inDays<=2);
 if(late.length) return {title:`Pay ${late[0].name} soon`,body:`${money(late[0].amount)} is due ${late[0].inDays===0?'today':'in '+late[0].inDays+' days'}. Tick it off once it is paid.`,btn:'<button class="btn primary" onclick="go(\'bills\')">Open bills</button>'};
 if(!S.expenses.length) return {title:'Log your first expense',body:'Log it the same day, even if it is tiny. Tiny entries count.',btn:'<button class="btn primary" onclick="openExpense()">＋ Log expense</button>'};
 const over=S.envelopes.find(e=>envSpent(e.name)>e.limit);
 if(over) return {title:`${over.name} is over budget`,body:`You are ${money(envSpent(over.name)-over.limit)} past this envelope. Decide whether to move money or pause.`,btn:'<button class="btn primary" onclick="go(\'budget\')">Review envelopes</button>'};
 if(S.impulse.some(x=>x.decision==='waiting'&&(Date.now()-new Date(x.date).getTime())>=2*86400000))
  return {title:'Impulse buys are ready to decide',body:'Your 48-hour pause is up. Are you still excited about them?',btn:'<button class="btn primary" onclick="go(\'impulse\')">Decide</button>'};
 return {title:'You are on track',body:'Nothing urgent right now. Take a breath and enjoy it.',btn:'<button class="btn" onclick="go(\'reset\')">Do weekly reset</button>'};
}
function donutHTML(){
 const m=curMonth();
 const totals=S.envelopes.map(e=>({name:e.name,color:e.color,v:envSpent(e.name)})).filter(x=>x.v>0);
 const total=sum(totals,x=>x.v);
 if(!total) return '<div class="empty" style="padding:20px">Your spending breakdown appears here.</div>';
 let acc=0;const stops=totals.map(x=>{const a=acc,b=acc+x.v/total*100;acc=b;return `${x.color} ${a}% ${b}%`}).join(',');
 return `<div class="row" style="align-items:center;gap:20px;flex-wrap:wrap;justify-content:center">
   <div class="donut" style="background:conic-gradient(${stops})"></div>
   <div class="legend">${totals.map(x=>`<div class="row small"><span><span class="dot" style="background:${x.color}"></span>${envName(x.name)}</span><b>${Math.round(x.v/total*100)}%</b></div>`).join('')}</div>
 </div>`;
}
function trendHTML(){
 const months=monthsBack(6);
 const vals=months.map(mo=>({mo,s:monthSpent(mo),i:monthIncome(mo)}));
 const max=Math.max(1,...vals.map(v=>Math.max(v.s,v.i)));
 return `<div class="bars">${vals.map(v=>`<div class="bar-col" title="${v.mo}: ${money(v.s)}">
   <div class="bar" style="height:${Math.max(3,v.s/max*100)}%"></div><small>${v.mo.slice(5)}</small></div>`).join('')}</div>`;
}

function openEnvelope(id){

function saveEnvelope(ev,id){ev.preventDefault();const f=new FormData(ev.target);const name=f.get('name').trim();const limit=+f.get('limit');const color=f.get('color');
 if(id){const e=S.envelopes.find(x=>x.id===id);const old=e.name;e.name=name;e.limit=limit;e.color=color;S.expenses.forEach(x=>{if(x.env===old)x.env=name});S.bills.forEach(b=>{if(b.env===old)b.env=name})}
 else S.envelopes.push({id:uid(),name,limit,color});
 save();closeModal();render();toast('Envelope saved')}
function deleteEnvelope(id){const e=S.envelopes.find(x=>x.id===id);if(!confirm(`Delete "${e.name}"? Past expenses keep their label.`))return;S.envelopes=S.envelopes.filter(x=>x.id!==id);save();closeModal();render()}

    </svg>
  </div>

  </div>
 </div>
 <div class="card" style="margin-top:18px"><div class="card-head"><h3>Monthly table</h3></div>

function backup(){download('adhd-budget-backup-'+todayISO()+'.json',JSON.stringify(S,null,2),'application/json');toast('Backup downloaded')}
function restore(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{S=Object.assign(blank(),JSON.parse(r.result));save();render();toast('Backup restored')}catch{toast('That file is not a valid backup')}};r.readAsText(f)}
function resetAll(){if(confirm('Delete ALL planner data? Download a backup first.')){S=blank();save();render();toast('Cleared')}}

/* ============ QUICK ADD + MODAL ============ */
function openQuick(){openModal(`<button class="close" onclick="closeModal()">×</button><h2>Quick add</h2>
 <div class="grid" style="grid-template-columns:1fr 1fr;gap:10px">
  <button class="btn" onclick="closeModal();openExpense()">− Expense</button>
  <button class="btn" onclick="closeModal();openIncome()">＋ Income</button>
  <button class="btn" onclick="closeModal();openBill()">▦ Bill</button>
  <button class="btn" onclick="closeModal();openImpulse()">✋ Impulse pause</button>
  <button class="btn" onclick="closeModal();openSub()">↻ Subscription</button>
  <button class="btn" onclick="closeModal();go('dashboard');setTimeout(()=>$('#brainIn')?.focus(),80)">🧠 Brain dump</button>
 </div>`)}
function openModal(html){$('#modalBox').innerHTML=html;$('#modal').classList.add('show')}
function closeModal(){$('#modal').classList.remove('show')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function cycleTheme(){const order=['light','dark','lavender','galapagos','riviera'];S.settings.theme=order[(order.indexOf(S.settings.theme)+1)%order.length];save();render();toast('Theme: '+themeLabel())}
function download(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

/* ============ boot ============ */
render();
</script>
</body>
</html>
